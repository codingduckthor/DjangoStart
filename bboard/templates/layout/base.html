{% load static %}

<!DOCTYPE html>
<html>
<head>
    <title>{% block title %}Домашка{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">
</head>
<body>
    <header>
        <h1>Announcments</h1>
    </header>

    <nav>
        <a href="{% url 'home' %}">Home</a>
        <a href="{% url 'add' %}">Add</a>
        {% for rubric in rubrics %}
            {# <a href="{{ rubric.pk }}/">{{ rubric.name }}</a> #}

        {% endfor %}

    </nav>

    <section>

        {% endblock %}

    <script src="{% static 'js/bootstrap.bundle.min.js' %}"></script>

</body>
</html>
